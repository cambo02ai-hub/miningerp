server:
  # Railway injects PORT at runtime; keep 8080 as the local default.
  port: ${PORT:8080}

spring:
  application:
    name: jpmonitor-backend

  # Virtual Threads (Project Loom)
  threads:
    virtual:
      enabled: true

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    # Prefer explicit Spring datasource variables on Railway; fall back to the
    # DB_* variables used by Docker Compose and local development.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jpmonitor_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:jpm_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: JpmHikariCP

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit_naming_strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
        format_sql: true
    show-sql: false
    open-in-view: false

  ai:
    mcp:
      server:
        name: jpmonitor-erp
        version: 1.0.0

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 hours

# CORS Configuration
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://jpmonitor.duckdns.org}

# Hermes AI API & CometAPI Configuration
hermes:
  api:
    url: ${HERMES_API_URL:http://localhost:8642}
    key: ${HERMES_API_KEY:hermes-jpmonitor-dev}

comet:
  api:
    url: ${COMET_API_URL:https://api.cometapi.com}
    key: ${COMET_API_KEY:}
    model: ${COMET_API_MODEL:gemini-3.5-flash}

# Telegram Notification Bot Configuration
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    enabled: ${TELEGRAM_NOTIFICATIONS_ENABLED:true}

# Actuator (health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging - production defaults
logging:
  level:
    root: WARN
    com.jpmonitor: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
